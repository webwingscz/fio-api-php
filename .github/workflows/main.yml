name: CI build
on: [ push, pull_request ]
jobs:
    build:
        name: PHP ${{ matrix.php-versions }} / ${{ matrix.dependencies }} deps on ${{ matrix.operating-system }}
        runs-on: ${{ matrix.operating-system }}
        strategy:
            fail-fast: false
            matrix:
                operating-system: [ ubuntu-latest ]
                php-versions: [ '8.3', '8.4' ]
                dependencies: [ 'highest' ]
                include:
                    # Lowest allowed dependencies, so the composer.json floors stay honest.
                    -   php-versions: '8.3'
                        operating-system: ubuntu-latest
                        dependencies: 'lowest'

                    # Windows
                    -   php-versions: '8.3'
                        operating-system: windows-latest
                        dependencies: 'highest'
                    -   php-versions: '8.4'
                        operating-system: windows-latest
                        dependencies: 'highest'

        steps:
            # see https://github.com/actions/checkout/issues/226#issue-606867805
            -   name: Prepare git
                run: git config --global core.autocrlf false

            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup PHP, with composer and extensions
                uses: shivammathur/setup-php@v2 #https://github.com/shivammathur/setup-php
                with:
                    php-version: ${{ matrix.php-versions }}
                    ini-values: memory_limit=-1
                    tools: composer:v2
                    coverage: none

            -   name: Get composer cache directory
                id: composer-cache
                shell: bash
                run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            -   name: Cache dependencies
                uses: actions/cache@v4
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: ${{ runner.os }}-composer-${{ matrix.php-versions }}-${{ matrix.dependencies }}-${{ hashFiles('**/composer.json') }}
                    restore-keys: ${{ runner.os }}-composer-

            # This is a library, so composer.lock is not committed and dependencies are resolved per job.
            -   name: Install Composer dependencies
                run: composer update --no-progress --prefer-dist --optimize-autoloader ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}

            -   name: Run CI Build
                run: composer ci

    guzzle:
        name: Guzzle ${{ matrix.guzzle }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                guzzle: [ '^7.0', '^8.0' ]
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup PHP, with composer and extensions
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.3'
                    ini-values: memory_limit=-1
                    tools: composer:v2
                    coverage: none

            -   name: Install Composer dependencies
                run: composer update --with "guzzlehttp/guzzle:${{ matrix.guzzle }}" --no-progress --prefer-dist

            -   name: Verify the resolved Guzzle version
                run: composer show guzzlehttp/guzzle | grep '^versions'

            -   name: Static analysis
                run: composer phpstan

            -   name: Tests
                run: composer test

    coverage:
        name: Coverage
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup PHP, with composer and extensions
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.3'
                    ini-values: memory_limit=-1
                    tools: composer:v2
                    coverage: xdebug

            -   name: Install Composer dependencies
                run: composer update --no-progress --prefer-dist

            -   name: Tests with coverage
                run: composer test-coverage

            -   name: Upload coverage results to Coveralls
                env:
                    COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    composer global require php-coveralls/php-coveralls
                    php-coveralls --coverage_clover=build/logs/clover.xml -v

    release:
        name: Create GitHub Release
        needs: [ build, guzzle ]
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-rc') }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            -   name: Create release
                uses: softprops/action-gh-release@v2
                with:
                    tag_name: ${{ github.ref_name }}
                    generate_release_notes: true
